[package]
name = "notkaif/igneous"
description = "Lightweight, modular FPS framework for Roblox providing core weapon mechanics with a hook-based modpack system"
version = "3.0.1"
license = "MIT"
authors = ["Kaif"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = [
    "sourcemap.json",
    "rokit.toml",
    "default.project.json",
    ".gitignore",
    "Assets",
    ".vscode",
    "README.md",
    "selene.toml",
    "Packages",
    "docs",
    "moonwave.toml",
    "Modpacks",
    "build",
]

[dependencies]
Trove = "sleitnick/trove@1.5.1"
Motus = "notkaif/motus@1.1.0"
